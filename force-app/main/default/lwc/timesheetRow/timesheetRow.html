<template>
  <div class="ts-rowCard">
    <div class="ts-rowTop">
      <span class={badgeClass}>{badgeLabel}</span>

      <lightning-button-icon
        class="ts-removeBtn"
        icon-name="utility:close"
        alternative-text="Remove"
        title="Remove"
        variant="bare"
        size="medium"
        onclick={handleRemoveClick}
      ></lightning-button-icon>
    </div>

    <div class="slds-p-around_medium">
      <div class={formFactorClass}>
        <!-- LOOKUP -->
        <div
          class="slds-p-right_small ts-col--lookup slds-col slds-size_2-of-8"
        >
          <div class={lookupWrapClass}>
            <lightning-record-edit-form
              density="comfy"
              object-api-name="Timesheet__c"
            >
              <lightning-input-field
                class="validated"
                data-field="objectRecordId"
                field-name={lookupFieldApiName}
                variant="standard"
                onchange={handleLookupChange}
                required
              ></lightning-input-field>
            </lightning-record-edit-form>

            <template if:true={lookupError}>
              <div class="slds-form-element__help">{lookupError}</div>
            </template>
          </div>
        </div>

        <!-- DATE -->
        <div class="slds-p-right_small ts-col--date slds-col slds-size_2-of-8">
          <lightning-input
            class="validated"
            type="date"
            name="date"
            value={date}
            onchange={handleInputChange}
            label="Date"
            required
          ></lightning-input>
        </div>

        <!-- TIME -->
        <div
          class="slds-p-right_small ts-col--remark ts-col--time slds-col slds-size_1-of-8"
        >
          <lightning-input
            class="validated"
            type="number"
            name="stime"
            value={stime}
            onchange={handleInputChange}
            label="Time"
            required
          ></lightning-input>
        </div>

        <!-- REMARKS -->
        <div class="slds-col slds-size_3-of-8">
          <lightning-textarea
            class="validated"
            max-length="255"
            name="temp_remark"
            value={tempRemark}
            placeholder="type here..."
            variant="standard"
            onblur={handleInputChange}
            label="Remarks"
            required
          ></lightning-textarea>
        </div>
      </div>
    </div>
  </div>
</template>
